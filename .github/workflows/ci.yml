name: CI for Docker Image

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    versioning:
      runs-on: ubuntu-latest
      name: Versioning
      outputs:
        package_version: ${{ steps.version.outputs.majorMinorPatch }}

      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3.0.0

    build:
        permissions:
          contents: write # to allow release creation
        needs: [versioning]
        name: Build
        runs-on: windows-latest
        env:
            DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            SEMVER: ${{ needs.versioning.outputs.package_version }}
            DOCKER_IMAGE_VERSION: ${{ vars.DOCKER_USERNAME }}/win-dev-env:${{ needs.versioning.outputs.package_version }}
            DOCKER_IMAGE_LATEST: ${{ vars.DOCKER_USERNAME }}/win-dev-env:latest
            CONAN_HOME: C:\dev\.conan

        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ env.DOCKER_USERNAME }}
            password: ${{ env.DOCKER_PASSWORD }}

        - name: Create Image
          run: >
            docker build 
            -t ${{ env.DOCKER_IMAGE_LATEST }} 
            -t ${{ env.DOCKER_IMAGE_VERSION }} 
            -m 2GB .

        - name: Setup Conan configuraiton
          run: |
            mkdir .conan -Force
            docker run --rm -e CONAN_HOME -v "${{ github.workspace }}:C:\dev" -w "C:\dev" ${{ env.DOCKER_IMAGE_VERSION }} conan profile detect --force

        - name: Verify Image
          run: >
            docker run --rm 
            -e CONAN_HOME 
            -v "${{ github.workspace }}:C:\dev" 
            -w "C:\dev" 
            ${{ env.DOCKER_IMAGE_VERSION }}
            conan build .

        - name: Push Image
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          run: |
            docker push ${{ vars.DOCKER_USERNAME }}/win-dev-env -a

        - name: Create Release
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ needs.versioning.outputs.package_version }}
            name: v${{ needs.versioning.outputs.package_version }}
            body: Docker Image ${{ env.DOCKER_IMAGE_VERSION }}
            body_path: ./build/manifests.md
            token: ${{ secrets.GITHUB_TOKEN }}
            draft: false
            prerelease: false
